[package]
name = "zetto"
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.89"
authors = ["Igor Kramar <i@ikramar.ru>"]
license = "MIT"
description = "Локальная связанная база знаний в Markdown"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "=2.0.0"
ulid = "=1.2.1"
slug = "0.1.6"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
pulldown-cmark = "0.13.5"
sha2 = "0.10"
tempfile = "3"
toml = "1.1"
shell-words = "1.1"
clap = { version = "4.6", features = ["derive"] }
ctrlc = "3.5.2"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
unicode-segmentation = "1.12"
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled", "hooks"] }
